name: TCP socket integration test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tcp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real loopback TCP integration test
        run: python -m unittest discover -s labs/tcp-socket/tests -v
      - name: Run localhost HTTP proxy integration test
        run: python -m unittest discover -s labs/http-proxy/tests -v
